<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite - Place Your Order</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .order-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      color: #e65100;
      margin-bottom: 30px;
    }

    label {
      font-weight: 600;
      margin-top: 15px;
      display: block;
      color: #333;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #ff5722;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #e64a19;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
    }

    .back-home:hover {
      text-decoration: underline;
    }

    .note {
      font-size: 12px;
      color: #777;
      margin-top: -10px;
    }
  </style>
</head>
<body>
  <div class="order-container">
    <h2>🍔 Place Your Order</h2>
    <form id="orderForm" action="submit_order.php" method="POST">

      <label for="food_item">Select Food Item</label>
      <select name="food_item" id="food_item" required>
        <option value="" disabled selected>-- Choose your meal --</option>
        <option value="Burger">Burger</option>
        <option value="Pizza">Pizza</option>
        <option value="Chicken">Chicken</option>
        <option value="Chips & Sausage">Chips & Sausage</option>
        <option value="Chapati & Beans">Chapati & Beans</option>
        <option value="Fish Fry">Fish Fry</option>
      </select>

      <label for="quantity">Quantity</label>
      <input type="number" name="quantity" id="quantity" value="1" min="1" required>

      <label for="instructions">Special Instructions</label>
      <textarea name="instructions" id="instructions" placeholder="Any allergies, preferences, etc."></textarea>

      <label for="address">Delivery Address</label>
      <textarea name="address" id="address" placeholder="Enter full delivery address" required></textarea>

      <label for="phone">Phone Number</label>
      <input type="tel" name="phone" id="phone" placeholder="07XXXXXXXX" required>

      <label for="payment">Payment Option</label>
      <select name="payment" id="payment" required>
        <option value="" disabled selected>-- Select payment method --</option>
        <option value="Mpesa">Mpesa</option>
        <option value="Cash on Delivery">Cash on Delivery</option>
        <option value="Airtel Money">Airtel Money</option>
      </select>

      <p class="note">💬 We will call or text you to confirm your order before delivery.</p>

      <button type="submit">✅ Confirm Order</button>
    </form>
    <a href="index.html" class="back-home">← Back to Home</a>
  </div>
</body>
</html>
