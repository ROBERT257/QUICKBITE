<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Electric Blue Gradient -->
    <linearGradient id="electricGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Orange Accent Gradient -->
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9558;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00D4FF" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Delivery Lightning Icon -->
  <g transform="translate(10, 15)">
    <!-- Lightning Bolt -->
    <path d="M12 2 L8 12 L10 12 L6 20 L12 28 L18 20 L16 20 L20 28 L12 38 L8 38 L4 28 L2 28 L8 20 L14 20 L16 12 L12 2 Z" 
          fill="url(#electricGradient)" 
          filter="url(#neonGlow)"
          opacity="0.9">
      <animate attributeName="opacity" 
               values="0.9;1;0.9" 
               dur="2.5s" 
               repeatCount="indefinite"/>
    </path>
    
    <!-- Delivery Circle -->
    <circle cx="12" cy="20" r="18" 
            fill="none" 
            stroke="url(#orangeAccent)" 
            stroke-width="2" 
            opacity="0.6">
      <animate attributeName="r" 
               values="18;20;18" 
               dur="3s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.6;0.9;0.6" 
               dur="3s" 
               repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- QuickBite Text -->
  <g transform="translate(45, 20)">
    <!-- Quick -->
    <text x="0" y="8" 
             font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
             font-size="20" 
             font-weight="800" 
             fill="url(#textGradient)"
             filter="url(#shadow)">
      Quick
    </text>
    
    <!-- Bite -->
    <text x="46" y="8" 
             font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
             font-size="20" 
             font-weight="200" 
             fill="url(#textGradient)"
             filter="url(#shadow)">
      Bite
    </text>
    
    <!-- Accent Dot -->
    <circle cx="82" cy="6" r="3" fill="url(#orangeAccent)">
      <animate attributeName="opacity" 
               values="1;0.3;1" 
               dur="2s" 
               repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Tech Particles -->
  <g opacity="0.5">
    <circle cx="145" cy="15" r="1.5" fill="#00D4FF">
      <animate attributeName="cy" 
               values="15;10;15" 
               dur="4s" 
               repeatCount="indefinite"/>
    </circle>
    <circle cx="165" cy="25" r="1" fill="#FF6B35">
      <animate attributeName="opacity" 
               values="0;1;0" 
               dur="3s" 
               begin="1s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="35" r="1.5" fill="#00D4FF">
      <animate attributeName="cy" 
               values="35;30;35" 
               dur="3.5s" 
               begin="2s"
               repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
