<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF00FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D9FF" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Lightning Bolt Icon -->
  <g transform="translate(10, 15)">
    <!-- Main Bolt -->
    <path d="M12 2 L8 18 L10 18 L6 26 L14 26 L12 34 L18 34 L16 34 L20 42 L12 42 L6 42 L0 34 L-2 34 L4 26 L10 26 L8 18 L12 2 Z" 
          fill="url(#neonGradient)" 
          filter="url(#glow)"
          opacity="0.9">
      <animate attributeName="opacity" 
               values="0.9;1;0.9" 
               dur="3s" 
               repeatCount="indefinite"/>
    </path>
    
    <!-- Energy Ring -->
    <circle cx="10" cy="22" r="20" 
            fill="none" 
            stroke="url(#neonGradient)" 
            stroke-width="1" 
            opacity="0.3">
      <animate attributeName="r" 
               values="20;22;20" 
               dur="2s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.3;0.6;0.3" 
               dur="2s" 
               repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- QuickBite Text -->
  <g transform="translate(45, 20)">
    <!-- Quick -->
    <text x="0" y="8" 
             font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
             font-size="18" 
             font-weight="700" 
             fill="url(#textGradient)"
             filter="url(#shadow)">
      Quick
    </text>
    
    <!-- Bite -->
    <text x="42" y="8" 
             font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
             font-size="18" 
             font-weight="300" 
             fill="url(#textGradient)"
             filter="url(#shadow)">
      Bite
    </text>
    
    <!-- Accent Line -->
    <rect x="0" y="14" width="80" height="2" 
          fill="url(#neonGradient)" 
          opacity="0.6" 
          rx="1">
      <animate attributeName="opacity" 
               values="0.6;1;0.6" 
               dur="4s" 
               repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Subtle Particle Effects -->
  <g opacity="0.4">
    <circle cx="140" cy="15" r="1" fill="#00D9FF">
      <animate attributeName="opacity" 
               values="0;1;0" 
               dur="3s" 
               repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="25" r="1" fill="#FF00FF">
      <animate attributeName="opacity" 
               values="0;1;0" 
               dur="3s" 
               begin="1s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="35" r="1" fill="#FF6B35">
      <animate attributeName="opacity" 
               values="0;1;0" 
               dur="3s" 
               begin="2s"
               repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
