<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Gradient -->
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Soft Shadow -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Modern Fork & Knife Icon -->
  <g transform="translate(10, 12)">
    <!-- Fork -->
    <path d="M8 4 L8 28 L10 28 L10 32 L12 32 L12 28 L14 28 L14 4 Z M16 8 L16 24 L18 24 L18 28 L20 28 L20 8 Z" 
          fill="url(#modernGradient)" 
          filter="url(#softShadow)"
          rx="1"/>
    
    <!-- Knife -->
    <rect x="22" y="6" width="3" height="26" 
             fill="url(#modernGradient)" 
             rx="1" 
             transform="rotate(-15 23.5 19)"/>
    <rect x="21" y="28" width="5" height="8" 
             fill="url(#modernGradient)" 
             rx="1" 
             transform="rotate(-15 23.5 19)"/>
  </g>
  
  <!-- QuickBite Text -->
  <g transform="translate(45, 20)">
    <!-- Quick -->
    <text x="0" y="8" 
             font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
             font-size="18" 
             font-weight="700" 
             fill="url(#textGradient)"
             filter="url(#softShadow)">
      Quick
    </text>
    
    <!-- Bite -->
    <text x="42" y="8" 
             font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
             font-size="18" 
             font-weight="300" 
             fill="url(#textGradient)"
             filter="url(#softShadow)">
      Bite
    </text>
    
    <!-- Modern Underline -->
    <rect x="0" y="14" width="80" height="2" 
          fill="url(#modernGradient)" 
          rx="1"/>
  </g>
  
  <!-- Speed Lines -->
  <g opacity="0.3">
    <line x="140" y="20" x2="150" y2="20" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
    <line x="155" y="20" x2="165" y2="20" stroke="#F7931E" stroke-width="2" stroke-linecap="round"/>
    <line x="170" y="20" x2="180" y2="20" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
